name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Manifest
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-action-manifest
          ref: 46c950bed37fe3812000895430bc0312d29e37ce
          path: upstream/manifest

      - name: Checkout pinned Authority Context
        uses: actions/checkout@v4
        with:
          repository: cogno-us/constitutional-governance-for-institutions
          ref: fb3d97938969a89e149e8ff8db2756091d1233fc
          path: upstream/authority-context

      - name: Checkout pinned Control Plane
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-control-plane
          ref: 2ea9528eeb87e14ff10f05de06473122b9df540f
          path: upstream/control-plane

      - name: Checkout pinned Moltbot Safe
        uses: actions/checkout@v4
        with:
          repository: cogno-us/moltbot-safe
          ref: 177354e959cc78c59c1a776f018cfbfbf28c927b
          path: upstream/moltbot-safe

      - name: Checkout pinned Replay
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-replay-bundle
          ref: 274543f1cd7171784a923a8e37015017a0d8bc9d
          path: upstream/replay

      - name: Checkout pinned Evidence Pack
        uses: actions/checkout@v4
        with:
          repository: cogno-us/cognous-agent-governance-evidence-pack
          ref: 812194b9a89a5fa21e675200fcb4e0089666f1b6
          path: upstream/evidence-pack

      - name: Checkout pinned ODES
        uses: actions/checkout@v4
        with:
          repository: cogno-us/open-decision-evidence-standard
          ref: 226adb0e3cde5377ac9db6f7e5857bfa7e65e30a
          path: upstream/odes

      - name: Verify pinned revisions
        run: |
          test "$(git -C upstream/manifest rev-parse HEAD)" = "46c950bed37fe3812000895430bc0312d29e37ce"
          test "$(git -C upstream/authority-context rev-parse HEAD)" = "fb3d97938969a89e149e8ff8db2756091d1233fc"
          test "$(git -C upstream/control-plane rev-parse HEAD)" = "2ea9528eeb87e14ff10f05de06473122b9df540f"
          test "$(git -C upstream/moltbot-safe rev-parse HEAD)" = "177354e959cc78c59c1a776f018cfbfbf28c927b"
          test "$(git -C upstream/replay rev-parse HEAD)" = "274543f1cd7171784a923a8e37015017a0d8bc9d"
          test "$(git -C upstream/evidence-pack rev-parse HEAD)" = "812194b9a89a5fa21e675200fcb4e0089666f1b6"
          test "$(git -C upstream/odes rev-parse HEAD)" = "226adb0e3cde5377ac9db6f7e5857bfa7e65e30a"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned integration packages and workbench
        run: |
          pip install -e upstream/control-plane
          pip install -e upstream/replay
          pip install -e upstream/odes
          pip install -e upstream/evidence-pack
          pip install -e .[dev]
          python - <<'PY'
          import agent_control_plane
          import agent_replay_bundle
          import odes
          import agent_governance_evidence_pack
          PY

      - name: Run tests
        env:
          GAX_QUALIFICATION_RESULTS: /tmp/gax-observation-repair-results.json
          UPSTREAM_MANIFEST_EXAMPLE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
          UPSTREAM_REPLAY_SUCCESS_EXAMPLE: upstream/replay/examples/bounded_success_reconstruction_v0_2.json
          UPSTREAM_REPLAY_LOST_ACK_EXAMPLE: upstream/replay/examples/bounded_lost_ack_reconstruction_v0_2.json
        run: pytest -q tests

      - name: Run demonstration command
        env:
          UPSTREAM_MANIFEST_EXAMPLE: upstream/manifest/examples/refund_integration_v1_1.manifest.json
          UPSTREAM_REPLAY_SUCCESS_EXAMPLE: upstream/replay/examples/bounded_success_reconstruction_v0_2.json
        run: python -m experiments.odex_gax_imx_reference.demo --manifest "$UPSTREAM_MANIFEST_EXAMPLE" --replay "$UPSTREAM_REPLAY_SUCCESS_EXAMPLE" --out /tmp/gax-imx-demo.json

      - uses: actions/upload-artifact@v4
        with:
          name: gax-observation-repair-${{ github.sha }}-py${{ matrix.python-version }}
          path: |
            /tmp/gax-observation-repair-results.json
            /tmp/gax-imx-demo.json
