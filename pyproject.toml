[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alvorada-gax-imx-reference"
version = "0.1.0"
description = "Bounded experimental ODEX-GAX/IMX governed exchange reference"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["experiments*"]
exclude = ["upstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
